[package]
name = "monx"
version = "0.1.71"
description = "MONx — Ironcore monster XML editor"
authors = ["Ironcore"]
edition = "2021"
license = "MIT"

[lib]
name = "monx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds `../dist` and serves it over the custom protocol. Without it a release
# binary keeps the devUrl baked in and needs the Vite server running. Default so
# plain `cargo build --release` works; `tauri dev` passes --no-default-features.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
image = { version = "0.24", default-features = false, features = ["png", "gif"] }
quick-xml = "0.31"
byteorder = "1.5"
# Modern Tibia clients ship sprite sheets as raw LZMA1. Pure Rust on purpose:
# the C bindings would put a build toolchain in the way of every build.
lzma-rs = "0.3"

[profile.release]
opt-level = 3
lto = true
